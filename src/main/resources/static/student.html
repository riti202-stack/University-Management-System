<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMS Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="student">
<header>
    <strong>UMS | Student Portal</strong>
    <span class="right"><span id="who"></span><button id="logout" class="light">Logout</button></span>
</header>
<main>
    <div id="msg"></div>
    <div id="panel"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/profile-panel.js"></script>
<script>
    (async () => {
      const me = await requireRole('STUDENT');
      if (!me) return;

      new ProfilePanel($('#panel'), 'students',
        [
          { key: 'name', label: 'Full name' },
          { key: 'email', label: 'Email' },
          { key: 'roll', label: 'Roll' },
          { key: 'age', label: 'Age', type: 'number' },
          { key: 'batch', label: 'Batch' },
          { key: 'className', label: 'Class' },
          { key: 'department', label: 'Department' }
        ],
        [
          { key: 'username', label: 'Username' },
          { key: 'gpa', label: 'GPA (set by your teachers)' }
        ]);
    })();
</script>
</body>
</html>
