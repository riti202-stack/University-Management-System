<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMS Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="student">
<header>
    <strong>UMS | Student Portal</strong>
    <span class="right"><span id="who"></span><button id="logout" class="light">Logout</button></span>
</header>
<main>
    <div id="msg"></div>
    <div id="panel"></div>
</main>

<script src="/js/common.js"></script>
<script>
    (async () => {
      const me = await requireRole('STUDENT');
      if (!me) return;
      new Panel($('#panel'), 'students', 'Student', true);
    })();
</script>
</body>
</html>
