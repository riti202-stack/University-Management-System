<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMS Admin Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin">
<header>
    <strong>UMS | Admin Portal</strong>
    <span class="right"><span id="who"></span><button id="logout" class="light">Logout</button></span>
</header>
<main>
    <div id="msg"></div>

    <div class="stats">
        <div class="stat"><span id="n_admins">0</span>Admins</div>
        <div class="stat"><span id="n_teachers">0</span>Teachers</div>
        <div class="stat"><span id="n_students">0</span>Students</div>
        <div class="stat"><span id="n_pending">0</span>Pending teachers</div>
    </div>

    <div class="card" id="pendingCard">
        <h3>Pending teacher approvals</h3>
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Username</th><th>Department</th><th>Actions</th></tr></thead>
            <tbody id="pendingRows"></tbody>
        </table>
    </div>

    <div class="tabs">
        <button data-tab="admins" class="active">Admins</button>
        <button data-tab="teachers">Teachers</button>
        <button data-tab="students">Students</button>
    </div>

    <div id="p_admins"></div>
    <div id="p_teachers" class="hidden"></div>
    <div id="p_students" class="hidden"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/student-panel.js"></script>
<script>
    (async () => {
      const me = await requireRole('ADMIN');
      if (!me) return;

      const count = key => n => { $('#n_' + key).textContent = n; };
      new Panel($('#p_admins'), 'admins', 'Admin', false, count('admins'));
      const teachersPanel = new Panel($('#p_teachers'), 'teachers', 'Teacher', true, count('teachers'));
      new StudentPanel($('#p_students'), count('students'));

      async function loadPending() {
        const r = await api('/api/teachers');
        const pending = r.ok ? r.data.filter(t => t.approved === false) : [];
        $('#n_pending').textContent = pending.length;
        $('#pendingRows').innerHTML = pending.length
          ? pending.map(t => `
              <tr>
                <td>${esc(t.name)}</td><td>${esc(t.email)}</td>
                <td>${esc(t.username)}</td><td>${esc(t.department)}</td>
                <td>
                  <button class="small approve" data-id="${esc(t.id)}">Approve</button>
                  <button class="small danger reject" data-id="${esc(t.id)}">Reject</button>
                </td>
              </tr>`).join('')
          : '<tr><td colspan="5" class="empty">No teachers waiting for approval</td></tr>';
      }

      $('#pendingRows').addEventListener('click', async e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.classList.contains('approve')) {
          const r = await api('/api/teachers/' + id + '/approve', { method: 'PUT' });
          if (!r.ok) return say(errorText(r), false);
          say('Teacher approved', true);
        } else {
          if (!confirm('Reject and delete this registration?')) return;
          const r = await api('/api/teachers/' + id, { method: 'DELETE' });
          if (!r.ok) return say(errorText(r), false);
          say('Registration rejected', true);
        }
        loadPending();
        teachersPanel.load();
      });

      loadPending();

      document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
          ['admins', 'teachers', 'students'].forEach(k =>
            $('#p_' + k).classList.toggle('hidden', k !== btn.dataset.tab));
          $('#msg').textContent = '';
        });
      });
    })();
</script>
</body>
</html>
