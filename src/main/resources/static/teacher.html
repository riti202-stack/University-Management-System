<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMS Teacher Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="teacher">
<header>
    <strong>UMS | Teacher Portal</strong>
    <span class="right"><span id="who"></span><button id="logout" class="light">Logout</button></span>
</header>
<main>
    <div id="msg"></div>

    <div class="tabs">
        <button data-tab="profile" class="active">My Profile</button>
        <button data-tab="students">Students</button>
    </div>

    <div id="p_profile"></div>
    <div id="p_students" class="hidden"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/profile-panel.js"></script>
<script src="/js/student-panel.js"></script>
<script>
    (async () => {
      const me = await requireRole('TEACHER');
      if (!me) return;

      new ProfilePanel($('#p_profile'), 'teachers',
        [
          { key: 'name', label: 'Full name' },
          { key: 'email', label: 'Email' },
          { key: 'department', label: 'Department' }
        ],
        [ { key: 'username', label: 'Username' } ]);
      new StudentPanel($('#p_students'));

      document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
          ['profile', 'students'].forEach(k =>
            $('#p_' + k).classList.toggle('hidden', k !== btn.dataset.tab));
          $('#msg').textContent = '';
        });
      });
    })();
</script>
</body>
</html>
